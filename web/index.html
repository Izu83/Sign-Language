<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#004643">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Signs">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Sign Language</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="start" class="start">
    <img src="icons/icon-192.png" alt="" class="logo">
    <h1>Sign Language</h1>
    <p>Learn signs with your camera. Show a sign and the app checks it for you.</p>
    <button id="startBtn" class="primary">Start camera</button>
    <p id="startNote" class="note">Your camera stays on your phone. Nothing is uploaded.</p>
  </section>

  <main id="app" class="app" hidden>
    <div class="camera">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div id="status" class="status">Starting...</div>
      <button id="outlineBtn" class="chip" aria-pressed="true">Outline: on</button>
      <div id="banner" class="banner" hidden></div>
    </div>

    <div class="sheet">
      <div class="modes" role="tablist">
        <button class="mode active" data-mode="learn" role="tab">Sign + meaning</button>
        <button class="mode" data-mode="guess" role="tab">Meaning only</button>
      </div>

      <div class="progress"><span id="counter"></span><div class="bar"><i id="barFill"></i></div></div>

      <div class="card">
        <div class="picture"><img id="pic" alt=""><div id="placeholder" class="placeholder" hidden>?</div></div>
        <h2 id="name"></h2>
        <p id="how" class="how"></p>
        <button id="hintBtn" class="link" hidden>Show me the sign</button>
      </div>

      <div class="actions">
        <button id="skipBtn" class="primary">Skip &rarr;</button>
        <button id="resetBtn" class="link">Reset progress</button>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
